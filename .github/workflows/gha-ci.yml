# PoC stub of gha-ci for a personal fork: same dispatch inputs, run name and dispatch concurrency. It only waits.
name: gha-ci

run-name: >-
  ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request != null
  && format('PR #{0} · {1}', github.event.issue.number, github.event.issue.title)
  || github.event_name == 'workflow_dispatch' && inputs.pr != ''
  && format('PR #{0} · dispatch {1} {2}', inputs.pr, inputs.suite, inputs.sha)
  || github.event_name == 'workflow_dispatch'
  && format('dispatch {0} {1}', inputs.suite, inputs.sha)
  || '' }}

on:
  workflow_dispatch:
    inputs:
      sha:
        required: false
        default: ""
        type: string
      suite:
        required: false
        default: shell
        type: choice
        options: [shell, sql, medium, all]
      pr:
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: gha-ci-dispatch-${{ inputs.sha }}
  cancel-in-progress: true

jobs:
  stub:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record the request and wait
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          SUITE: ${{ inputs.suite }}
        run: |
          echo "stub gha-ci: pr=$PR sha=$SHA suite=$SUITE"
          sleep 900
